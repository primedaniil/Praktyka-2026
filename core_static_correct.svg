  <!-- Центральний вал -->
  <circle cx="320" cy="370" r="40" class="shaft-hole"/>
  <circle cx="320" cy="370" r="3" class="center-mark"/>
  
  <!-- Підписи -->
  <text x="320" y="375" class="label" text-anchor="middle" fill="#1e40af">Вал</text>
  <text x="320" y="200" class="label" text-anchor="middle">Сердечник якоря</text>
  <text x="320" y="560" class="note" text-anchor="middle">24 пази · Ø40 мм · крок 15° (360° / 24)</text>
  
  <!-- Розмір D_я -->
  <line x1="180" y1="580" x2="460" y2="580" class="dim-line"/>
  <line x1="180" y1="575" x2="180" y2="585" class="dim-line"/>
  <line x1="460" y1="575" x2="460" y2="585" class="dim-line"/>
  <text x="320" y="600" class="dim-text" text-anchor="middle">D_я = 40 мм</text>
  
  <!-- Розмір L_я -->
  <line x1="520" y1="230" x2="520" y2="510" class="dim-line"/>
  <line x1="515" y1="230" x2="525" y2="230" class="dim-line"/>
  <line x1="515" y1="510" x2="525" y2="510" class="dim-line"/>
  <text x="540" y="370" class="dim-text" text-anchor="middle" transform="rotate(90 540 370)">L_я = 32 мм</text>
  
  <!-- Вид збоку -->
  <rect x="620" y="270" width="80" height="200" class="core-body" rx="4"/>
  <text x="660" y="250" class="label" text-anchor="middle">Вид збоку</text>
  
  <!-- Параметри -->
  <rect x="600" y="500" width="260" height="150" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="730" y="525" class="label" text-anchor="middle">Параметри виробу</text>
  <text x="615" y="550" class="note">Діаметр: 40 мм</text>
  <text x="615" y="570" class="note">Довжина: 32 мм</text>
  <text x="615" y="590" class="note">Число пазів: 24</text>
  <text x="615" y="610" class="note">Кут між пазами: 15°</text>
  <text x="615" y="630" class="note">Щільність: 7.06 г/см³</text>
