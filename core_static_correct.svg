<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="auto" font-family="Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-size: 22px; fill: #1e3a8a; font-weight: bold; text-anchor: middle; }
      .subtitle { font-size: 14px; fill: #64748b; text-anchor: middle; }
      .core-body { fill: #2563eb; stroke: #1e40af; stroke-width: 2; }
      .slot-fill { stroke: #f8fafc; stroke-width: 7; stroke-linecap: round; fill: none; }
      .slot-outline { stroke: #1e40af; stroke-width: 9; stroke-linecap: round; fill: none; }
      .shaft-hole { fill: #f8fafc; stroke: #1e40af; stroke-width: 2; }
      .center-mark { fill: #dc2626; }
      .dim-line { stroke: #dc2626; stroke-width: 1.5; }
      .dim-text { font-size: 12px; fill: #dc2626; font-weight: bold; }
      .label { font-size: 13px; fill: #475569; font-weight: bold; }
      .note { font-size: 11px; fill: #64748b; font-style: italic; }
    </style>
  </defs>
  
  <rect width="900" height="700" class="bg"/>
  <text x="450" y="35" class="title">ГОТОВИЙ СЕРДЕЧНИК ЯКОРЯ</text>
  <text x="450" y="60" class="subtitle">24 пази рівномірно по колу · Ø40 мм · крок 15°</text>
  
  <!-- Сердечник -->
  <circle cx="320" cy="370" r="140" class="core-body"/>
  
  <!-- Пази (обводка) -->
  <g class="slot-outline">
    <line x1="320.00" y1="315.00" x2="320.00" y2="240.00"/>
