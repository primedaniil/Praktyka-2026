  <!-- Пази (заливка) -->
  <g class="slot-fill">
    <line x1="320.00" y1="315.00" x2="320.00" y2="240.00"/>
    <line x1="334.24" y1="316.87" x2="353.65" y2="244.43"/>
    <line x1="347.50" y1="322.37" x2="385.00" y2="257.42"/>
