<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .title { font-size: 22px; fill: #60a5fa; font-weight: bold; text-anchor: middle; }
      .subtitle { font-size: 14px; fill: #94a3b8; text-anchor: middle; }
      .core-outline { fill: none; stroke: #64748b; stroke-width: 2; }
      .shaft-outline { fill: none; stroke: #64748b; stroke-width: 2; }
      .label { font-size: 12px; fill: #cbd5e1; text-anchor: middle; }
      .temp-label { font-size: 14px; fill: #ffffff; font-weight: bold; text-anchor: middle; }
      .legend-text { font-size: 11px; fill: #cbd5e1; }
    </style>
    <radialGradient id="tempCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="tempEdge" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="700" class="bg"/>
  <text x="400" y="35" class="title">ТЕМПЕРАТУРНЕ ПОЛЕ СЕРДЕЧНИКА</text>
  <text x="400" y="60" class="subtitle">Після розмикання форми · Момент вилучення</text>
  
  <!-- Сердечник з градієнтом -->
  <circle cx="400" cy="350" r="180" fill="url(#tempEdge)"/>
  <circle cx="400" cy="350" r="140" fill="url(#tempCenter)"/>
  <circle cx="400" cy="350" r="180" class="core-outline"/>
  <circle cx="400" cy="350" r="40" class="shaft-outline"/>
  
  <!-- Ізотерми -->
  <circle cx="400" cy="350" r="60" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
  <circle cx="400" cy="350" r="100" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <circle cx="400" cy="350" r="140" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
  <circle cx="400" cy="350" r="180" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,4" opacity="0.2"/>
  
  <!-- Температурні позначки -->
  <text x="400" y="355" class="temp-label">1150°C</text>
  <text x="400" y="290" class="label">950°C</text>
  <text x="400" y="240" class="label">750°C</text>
  <text x="400" y="200" class="label">550°C</text>
  <text x="400" y="170" class="label">350°C</text>
  
  <!-- Підписи -->
  <text x="400" y="560" class="label">Центр: 1150°C</text>
  <text x="400" y="580" class="label">Поверхня: 350°C</text>
  <text x="400" y="600" class="label">Градієнт: 800°C</text>
  
  <!-- Легенда -->
  <rect x="600" y="100" width="180" height="180" fill="#1e293b" stroke="#475569" rx="8" opacity="0.9"/>
  <text x="690" y="125" class="label" fill="#60a5fa" font-weight="bold">Температура</text>
  
  <rect x="615" y="140" width="20" height="15" fill="#dc2626"/>
  <text x="645" y="153" class="legend-text">1150°C</text>
  
  <rect x="615" y="165" width="20" height="15" fill="#f97316"/>
  <text x="645" y="178" class="legend-text">950°C</text>
  
  <rect x="615" y="190" width="20" height="15" fill="#eab308"/>
  <text x="645" y="203" class="legend-text">750°C</text>
  
  <rect x="615" y="215" width="20" height="15" fill="#22c55e"/>
  <text x="645" y="228" class="legend-text">550°C</text>
  
  <rect x="615" y="240" width="20" height="15" fill="#2563eb"/>
  <text x="645" y="253" class="legend-text">350°C</text>
  
  <!-- Примітка -->
  <text x="400" y="650" class="label" font-style="italic">⚠️ Температура виміряна через 5 секунд після розмикання форми</text>
</svg>