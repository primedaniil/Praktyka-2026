<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="Arial, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-size: 22px; fill: #1e3a8a; font-weight: bold; text-anchor: middle; }
      .subtitle { font-size: 14px; fill: #64748b; text-anchor: middle; }
      .matrix-body { fill: #94a3b8; stroke: #475569; stroke-width: 2; }
      .matrix-cavity { fill: #fef9c3; stroke: #eab308; stroke-width: 2; }
      .punch { fill: #dc2626; stroke: #991b1b; stroke-width: 2; }
      .powder { fill: #f59e0b; opacity: 0.6; }
      .core { fill: #2563eb; stroke: #1e40af; stroke-width: 2; }
      .dim-line { stroke: #dc2626; stroke-width: 1.5; }
      .dim-text { font-size: 12px; fill: #dc2626; font-weight: bold; }
      .label { font-size: 13px; fill: #475569; font-weight: bold; }
      .note { font-size: 11px; fill: #64748b; font-style: italic; }
    </style>
  </defs>
  
  <rect width="800" height="700" class="bg"/>
  <text x="400" y="35" class="title">СХЕМА МАТРИЦІ ДЛЯ ПРЕСУВАННЯ</text>
  <text x="400" y="60" class="subtitle">Сердечник якоря ДПТ · Порошкова металургія</text>
  
  <!-- Матриця -->
  <rect x="200" y="250" width="400" height="300" class="matrix-body" rx="4"/>
  
  <!-- Порожнина матриці -->
  <rect x="300" y="250" width="200" height="300" class="matrix-cavity" rx="4"/>
  
  <!-- Порошок -->
  <rect x="300" y="380" width="200" height="170" class="powder" rx="4"/>
  <text x="400" y="470" class="label" text-anchor="middle">Порошок</text>
  <text x="400" y="490" class="note" text-anchor="middle">Fe + ізолятор</text>
  
  <!-- Пуансон -->
  <rect x="290" y="150" width="220" height="100" class="punch" rx="4"/>
  <text x="400" y="205" class="label" text-anchor="middle" fill="#ffffff">ПУАНСОН</text>
  
  <!-- Стрілка тиску -->
  <line x1="400" y1="100" x2="400" y2="145" stroke="#dc2626" stroke-width="4"/>
  <polygon points="395,145 400,155 405,145" fill="#dc2626"/>
  <text x="430" y="120" class="dim-text">F = 707 кН</text>
  
  <!-- Розміри -->
  <!-- Діаметр матриці -->
  <line x1="300" y1="580" x2="500" y2="580" class="dim-line"/>
  <line x1="300" y1="575" x2="300" y2="585" class="dim-line"/>
  <line x1="500" y1="575" x2="500" y2="585" class="dim-line"/>
  <text x="400" y="600" class="dim-text" text-anchor="middle">D_матриці = 40.8 мм</text>
  
  <!-- Висота матриці -->
  <line x1="620" y1="250" x2="620" y2="550" class="dim-line"/>
  <line x1="615" y1="250" x2="625" y2="250" class="dim-line"/>
  <line x1="615" y1="550" x2="625" y2="550" class="dim-line"/>
  <text x="640" y="400" class="dim-text" text-anchor="middle" transform="rotate(90 640 400)">H_матриці = 48 мм</text>
  
  <!-- Висота порожнини -->
  <line x1="180" y1="250" x2="180" y2="550" class="dim-line"/>
  <line x1="175" y1="250" x2="185" y2="250" class="dim-line"/>
  <line x1="175" y1="550" x2="185" y2="550" class="dim-line"/>
  <text x="160" y="400" class="dim-text" text-anchor="middle" transform="rotate(-90 160 400)">H_порожнини</text>
  
  <!-- Підписи -->
  <text x="400" y="640" class="label" text-anchor="middle">Матеріал матриці: сталь Х12МФ</text>
  <text x="400" y="660" class="note" text-anchor="middle">Твердість: HRC 58–62</text>
  
  <!-- Легенда -->
  <rect x="600" y="100" width="180" height="120" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="690" y="125" class="label" text-anchor="middle">Легенда</text>
  <rect x="615" y="140" width="20" height="15" class="matrix-body"/>
  <text x="645" y="152" class="note">Матриця</text>
  <rect x="615" y="165" width="20" height="15" class="matrix-cavity"/>
  <text x="645" y="177" class="note">Порожнина</text>
  <rect x="615" y="190" width="20" height="15" class="punch"/>
  <text x="645" y="202" class="note">Пуансон</text>
</svg>